<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MorAI</title>

<style>
:root{
  --bg:#f6f7fb;
  --panel:#ffffff;
  --panel2:#f9fafb;
  --border:#e5e7eb;
  --text:#0f172a;
  --muted:#6b7280;
  --accent:#10b981;
  --accentSoft:#d1fae5;
  --bubbleUser:#10b981;
  --bubbleAI:#eef2f7;
}
body.dark{
  --bg:#020617;
  --panel:#020617;
  --panel2:#0b1220;
  --border:#1f2937;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --accent:#22c55e;
  --accentSoft:#052e16;
  --bubbleUser:#16a34a;
  --bubbleAI:#0b1220;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Arial;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  overflow:hidden;
}
.app{display:flex;width:100%;max-width:1400px;margin:0 auto}

/* Sidebar */
.sidebar{
  width:280px;
  background:linear-gradient(to bottom,var(--panel),var(--panel2));
  border-right:1px solid var(--border);
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.brand{display:flex;justify-content:space-between;align-items:center}
.brand-left{display:flex;gap:8px;align-items:center}
.logo{width:26px;height:26px;border-radius:50%;background:#22c55e}
.btn{
  border:none;
  background:var(--accent);
  color:#fff;
  font-weight:700;
  border-radius:8px;
  padding:8px;
  cursor:pointer;
}
.tools{display:flex;gap:6px}
.tool{
  flex:1;
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
  border-radius:999px;
  padding:6px;
  cursor:pointer;
}
.chatlist{
  flex:1;
  border:1px solid var(--border);
  border-radius:10px;
  overflow:auto;
}
.chat-item{
  display:flex;
  justify-content:space-between;
  padding:8px;
  cursor:pointer;
}
.chat-item.active{background:var(--accentSoft)}
.menu{display:none}
.chat-item:hover .menu{display:block}

/* Main */
.main{flex:1;display:flex;flex-direction:column}
.topbar{
  height:50px;
  border-bottom:1px solid var(--border);
  padding:10px;
  display:flex;
  justify-content:space-between;
}
.messages{
  flex:1;
  overflow:auto;
  padding:16px;
  position:relative;
}
.empty{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.empty-card{
  padding:20px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel);
}
.row{display:flex;margin-bottom:10px}
.row.user{justify-content:flex-end}
.bubble{
  max-width:70%;
  padding:10px 12px;
  border-radius:14px;
  white-space:pre-wrap;
}
.bubble.user{
  background:var(--bubbleUser);
  color:#ecfdf5;
}
.bubble.ai{
  background:var(--bubbleAI);
}

/* Composer */
.composer{
  border-top:1px solid var(--border);
  padding:10px;
}
.composer-inner{
  display:flex;
  gap:8px;
}
textarea{
  flex:1;
  resize:none;
  padding:8px;
}
.send{
  background:var(--accent);
  border:none;
  color:#fff;
  font-weight:700;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body class="dark">
<div class="app">

<aside class="sidebar">
  <div class="brand">
    <div class="brand-left">
      <div class="logo"></div>
      <b>MorAI</b>
    </div>
    <span>Gemini</span>
  </div>

  <button class="btn" id="newChat">+ Yeni Sohbet</button>

  <div class="tools">
    <button class="tool" id="themeBtn">🌙 / ☀️</button>
    <button class="tool" id="clearAll">🧹</button>
  </div>

  <div class="chatlist" id="chatList"></div>
</aside>

<main class="main">
  <div class="topbar">
    <div id="chatTitle">Yeni sohbet</div>
    <div>Hazır</div>
  </div>

  <div class="messages" id="messages">
    <div class="empty" id="empty">
      <div class="empty-card">
        <b>Nereden başlayalım?</b><br/>
        Bir mesaj yaz reis.
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="composer-inner">
      <textarea id="input" placeholder="Mesaj yaz..."></textarea>
      <button class="send" id="send">Gönder</button>
    </div>
  </div>
</main>

</div>
<script>
const BACKEND_URL = "/api/chat";
const LS_CHATS = "morai_chats_v2";
const LS_THEME = "morai_theme_v2";

let chats = JSON.parse(localStorage.getItem(LS_CHATS) || "[]");
let currentId = chats[0]?.id || null;
let sending = false;

function save(){
  localStorage.setItem(LS_CHATS, JSON.stringify(chats));
}
function uid(){
  return Math.random().toString(16).slice(2)+"-"+Date.now().toString(16);
}
function byId(id){
  return chats.find(c=>c.id===id);
}
function setStatus(t){
  document.getElementById("statusText").textContent=t;
}

/* ===== THEME ===== */
function applyThemeFromStorage(){
  const t=localStorage.getItem(LS_THEME);
  document.body.classList.toggle("dark", t!=="light");
}
function toggleTheme(){
  const d=document.body.classList.toggle("dark");
  localStorage.setItem(LS_THEME,d?"dark":"light");
}

/* ===== CHAT ===== */
function ensureChat(){
  if(!chats.length){
    const id=uid();
    chats=[{id,title:"Yeni sohbet",messages:[]}];
    currentId=id;
    save();
  }
  if(!currentId) currentId=chats[0].id;
}

function newChat(){
  const id=uid();
  chats.unshift({id,title:"Yeni sohbet",messages:[]});
  currentId=id;
  save();
  renderAll();
}

function deleteChat(id){
  chats=chats.filter(c=>c.id!==id);
  ensureChat();
  save();
  renderAll();
}

function renderChatList(){
  const list=document.getElementById("chatList");
  list.innerHTML="";
  chats.forEach(c=>{
    const item=document.createElement("div");
    item.className="chat-item"+(c.id===currentId?" active":"");
    item.onclick=()=>{currentId=c.id;renderAll();};

    const t=document.createElement("div");
    t.className="chat-title";
    t.textContent=c.title;

    const m=document.createElement("div");
    m.className="chat-meta";
    m.textContent=c.messages.length?String(c.messages.length):"";

    const wrap=document.createElement("div");
    wrap.className="menu-wrap";

    const btn=document.createElement("button");
    btn.className="menu-btn";
    btn.textContent="⋯";
    btn.onclick=e=>{
      e.stopPropagation();
      menu.classList.toggle("open");
    };

    const menu=document.createElement("div");
    menu.className="menu";

    const del=document.createElement("div");
    del.className="menu-item danger";
    del.innerHTML="<span>Sil</span><span>🗑️</span>";
    del.onclick=e=>{
      e.stopPropagation();
      deleteChat(c.id);
    };

    menu.appendChild(del);
    wrap.appendChild(btn);
    wrap.appendChild(menu);

    item.appendChild(t);
    item.appendChild(m);
    item.appendChild(wrap);
    list.appendChild(item);
  });
}

function renderMessages(){
  const box=document.getElementById("messages");
  const empty=document.getElementById("emptyState");
  box.querySelectorAll(".row").forEach(n=>n.remove());

  const chat=byId(currentId);
  if(!chat.messages.length){
    empty.style.display="flex";
    return;
  }
  empty.style.display="none";

  chat.messages.forEach(m=>{
    const r=document.createElement("div");
    r.className="row "+m.role;
    const b=document.createElement("div");
    b.className="bubble "+m.role;
    b.textContent=m.content;
    r.appendChild(b);
    box.appendChild(r);
  });
  box.scrollTop=box.scrollHeight;
}

function renderAll(){
  renderChatList();
  document.getElementById("chatTitle").textContent=byId(currentId)?.title||"Yeni sohbet";
  renderMessages();
}

/* ===== SEND (HAFIZA BURADA) ===== */
async function sendMessage(){
  if(sending) return;
  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;

  ensureChat();
  const chat=byId(currentId);

  if(chat.title==="Yeni sohbet") chat.title=text.slice(0,32);

  chat.messages.push({role:"user",content:text});
  save();
  renderAll();
  input.value="";

  // 🔥 HAFIZA: SON 10 MESAJ
  const history=chat.messages.slice(-10);

  sending=true;
  setStatus("Gönderiliyor…");

  try{
    const r=await fetch(BACKEND_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:history})
    });
    const j=await r.json();
    chat.messages.push({role:"ai",content:j.reply||"Boş yanıt"});
  }catch{
    chat.messages.push({role:"ai",content:"Sunucu hatası"});
  }

  sending=false;
  setStatus("Hazır");
  save();
  renderAll();
}

/* ===== EVENTS ===== */
document.getElementById("sendBtn").onclick=sendMessage;
document.getElementById("input").onkeydown=e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();sendMessage();
  }
};
document.getElementById("newChatBtn").onclick=newChat;
document.getElementById("themeBtn").onclick=toggleTheme;
document.getElementById("clearAllBtn").onclick=()=>{
  if(confirm("Tüm sohbetler silinsin mi?")){
    chats=[];ensureChat();save();renderAll();
  }
};

/* ===== INIT ===== */
applyThemeFromStorage();
ensureChat();
renderAll();
setStatus("Hazır");
</script>


</body>
</html>
