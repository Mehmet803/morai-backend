<!-- =====================================================
     SAĞLAM SCRIPT (ENTER + HAFIZA + UI BOZULMAZ)
===================================================== -->
<script>
/* ================= CONFIG ================= */
const BACKEND_URL = "/api/chat";

/* ================= STATE ================= */
let chats = JSON.parse(localStorage.getItem("morai_chats") || "[]");
let currentId = chats[0]?.id || null;
let sending = false;

/* ================= HELPERS ================= */
function uid(){
  return Math.random().toString(16).slice(2) + Date.now();
}
function save(){
  localStorage.setItem("morai_chats", JSON.stringify(chats));
}
function byId(id){
  return chats.find(c => c.id === id);
}

/* ================= INIT CHAT ================= */
function ensureChat(){
  if(!chats.length){
    const id = uid();
    chats = [{ id, title:"Yeni sohbet", messages: [] }];
    currentId = id;
    save();
  }
  if(!currentId) currentId = chats[0].id;
}

/* ================= RENDER ================= */
function render(){
  const chat = byId(currentId);
  const wrap = document.getElementById("messages");
  const title = document.getElementById("chatTitle");

  if(title) title.textContent = chat?.title || "Yeni sohbet";
  if(!wrap) return;

  wrap.querySelectorAll(".row").forEach(n => n.remove());

  chat.messages.forEach(m=>{
    const row = document.createElement("div");
    row.className = "row " + (m.role === "user" ? "user" : "ai");

    const bubble = document.createElement("div");
    bubble.className = "bubble " + (m.role === "user" ? "user" : "ai");
    bubble.textContent = m.content;

    row.appendChild(bubble);
    wrap.appendChild(row);
  });

  wrap.scrollTop = wrap.scrollHeight;
}

/* ================= SEND MESSAGE ================= */
async function sendMessage(){
  if(sending) return;

  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;

  ensureChat();
  const chat = byId(currentId);

  if(chat.title === "Yeni sohbet"){
    chat.title = text.slice(0, 32);
  }

  chat.messages.push({ role:"user", content:text });
  save();
  render();

  input.value = "";

  // 🔥 HAFIZA (SON 10 MESAJ)
  const history = chat.messages.slice(-10);

  sending = true;

  try{
    const res = await fetch(BACKEND_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ messages: history })
    });

    const data = await res.json();
    chat.messages.push({
      role:"ai",
      content: data.reply || "Cevap gelmedi"
    });
  }catch(e){
    chat.messages.push({
      role:"ai",
      content:"Sunucu hatası"
    });
  }

  sending = false;
  save();
  render();
}

/* ================= EVENTS ================= */
document.getElementById("sendBtn").addEventListener("click", sendMessage);

document.getElementById("input").addEventListener("keydown", e=>{
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById("newChatBtn")?.addEventListener("click", ()=>{
  const id = uid();
  chats.unshift({ id, title:"Yeni sohbet", messages: [] });
  currentId = id;
  save();
  render();
});

/* ================= START ================= */
ensureChat();
render();
</script>
</body>
</html>
