<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MorAI</title>

<style>
:root{
  --accent:#22c55e;
  --bg:#020617;
  --panel:#020617cc;
  --border:#1f2937;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --bubbleUser:#16a34a;
  --bubbleAI:#0b1220;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  height:100vh;
  overflow:hidden;
  color:var(--text);
  background:
    linear-gradient(rgba(2,6,23,.85), rgba(2,6,23,.85)),
    url("https://images.wallpaperscraft.com/image/single/porsche_911_gt2_rs_green_160774_3840x2160.jpg")
    center/cover no-repeat fixed;
}

.app{display:flex;height:100vh;max-width:1400px;margin:0 auto}

/* SIDEBAR */
.sidebar{
  width:280px;
  background:linear-gradient(to bottom,#020617ee,#020617cc);
  border-right:1px solid var(--border);
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.brand{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  width:26px;height:26px;border-radius:50%;
  background:var(--accent);
}
.btn{
  background:var(--accent);
  border:none;
  color:#fff;
  font-weight:700;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

.tools{display:flex;gap:6px}
.tool{
  flex:1;
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
  border-radius:20px;
  padding:6px;
  cursor:pointer;
}

.chatlist{flex:1;overflow:auto}
.chat-item{
  padding:8px;
  border-radius:8px;
  cursor:pointer;
}
.chat-item.active{background:#22c55e33}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}
.topbar{
  height:56px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  border-bottom:1px solid var(--border);
}

.messages{
  flex:1;
  padding:20px;
  overflow:auto;
  position:relative;
}

/* EMPTY */
.empty{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}
.empty-card{
  background:#020617cc;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  text-align:center;
}
.quick{
  margin:4px;
  padding:6px 10px;
  border-radius:20px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  cursor:pointer;
}

/* CHAT */
.row{display:flex;margin-bottom:10px}
.row.user{justify-content:flex-end}
.bubble{
  max-width:70%;
  padding:10px 12px;
  border-radius:14px;
}
.bubble.user{background:var(--bubbleUser)}
.bubble.ai{background:var(--bubbleAI);border:1px solid var(--border)}

/* COMPOSER */
.composer{
  border-top:1px solid var(--border);
  padding:10px;
}
.composer-inner{
  display:flex;
  gap:10px;
}
textarea{
  flex:1;
  background:transparent;
  border:none;
  color:var(--text);
  resize:none;
  outline:none;
}
.send{
  background:var(--accent);
  border:none;
  color:#fff;
  padding:8px 16px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

@media(max-width:900px){.sidebar{display:none}}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
  <div class="brand">
    <div style="display:flex;gap:8px;align-items:center">
      <div class="logo"></div><b>MorAI</b>
    </div>
    <span style="color:#22c55e;font-size:12px">Gemini</span>
  </div>

  <button class="btn" id="newChat">+ Yeni sohbet</button>

  <div class="tools">
    <button class="tool" id="theme">🌙 / ☀️</button>
    <button class="tool" id="clear">🧹</button>
  </div>

  <div class="chatlist" id="chatList"></div>
</aside>

<main class="main">
<header class="topbar">
  <div>
    <b id="chatTitle">Yeni sohbet</b><br>
    <small>Enter: gönder • Shift+Enter: satır</small>
  </div>
  <div id="status">Hazır</div>
</header>

<section class="messages" id="messages">
  <div class="empty" id="empty">
    <div class="empty-card">
      <h3>Nereden başlayalım?</h3>
      <p>Bir mesaj yaz reis.</p>
      <button class="quick" data-q="BMW öner">BMW</button>
      <button class="quick" data-q="Günlük plan yap">Plan</button>
      <button class="quick" data-q="Motivasyon yaz">Motivasyon</button>
    </div>
  </div>
</section>

<section class="composer">
  <div class="composer-inner">
    <textarea id="input" placeholder="Mesaj yaz..."></textarea>
    <button class="send" id="send">Gönder</button>
  </div>
</section>
</main>

</div>

<script>
const API="/api/chat";
const LS="morai_chats";
let chats=JSON.parse(localStorage.getItem(LS)||"[]");
let current=null;

function save(){localStorage.setItem(LS,JSON.stringify(chats))}
function uid(){return Math.random().toString(36).slice(2)}
function ensure(){
  if(!chats.length){
    chats=[{id:uid(),title:"Yeni sohbet",messages:[]}];
    current=chats[0].id;
    save();
  }
  if(!current) current=chats[0].id;
}

function render(){
  const list=document.getElementById("chatList");
  list.innerHTML="";
  chats.forEach(c=>{
    const d=document.createElement("div");
    d.className="chat-item"+(c.id===current?" active":"");
    d.textContent=c.title;
    d.onclick=()=>{current=c.id;render()};
    list.appendChild(d);
  });

  const chat=chats.find(c=>c.id===current);
  document.getElementById("chatTitle").textContent=chat.title;

  const wrap=document.getElementById("messages");
  wrap.querySelectorAll(".row").forEach(e=>e.remove());
  document.getElementById("empty").style.display=chat.messages.length?"none":"flex";

  chat.messages.forEach(m=>{
    const r=document.createElement("div");
    r.className="row "+m.role;
    const b=document.createElement("div");
    b.className="bubble "+m.role;
    b.textContent=m.content;
    r.appendChild(b);
    wrap.appendChild(r);
  });
  wrap.scrollTop=wrap.scrollHeight;
}

async function send(){
  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;
  ensure();
  const chat=chats.find(c=>c.id===current);
  if(chat.title==="Yeni sohbet") chat.title=text.slice(0,24);

  chat.messages.push({role:"user",content:text});
  input.value="";
  render(); save();

  document.getElementById("status").textContent="Gönderiliyor…";

  try{
    const res=await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:chat.messages.slice(-10)})
    });
    const data=await res.json();
    chat.messages.push({role:"ai",content:data.reply||"Boş yanıt"});
  }catch{
    chat.messages.push({role:"ai",content:"Sunucu hatası"});
  }

  document.getElementById("status").textContent="Hazır";
  render(); save();
}

document.getElementById("send").onclick=send;
document.getElementById("input").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}
});
document.querySelectorAll(".quick").forEach(b=>{
  b.onclick=()=>{document.getElementById("input").value=b.dataset.q}
});
document.getElementById("newChat").onclick=()=>{
  chats.unshift({id:uid(),title:"Yeni sohbet",messages:[]});
  current=chats[0].id; save(); render();
};
document.getElementById("clear").onclick=()=>{
  if(confirm("Tüm sohbetler silinsin mi?")){
    chats=[]; current=null; save(); ensure(); render();
  }
};
document.getElementById("theme").onclick=()=>{
  document.body.classList.toggle("light");
};

ensure(); render();
</script>
</body>
</html>
