<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>MorAI</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

body {
  background: url("porsche.jpg") no-repeat center center fixed;
  background-size: cover;
  color: white;
}

/* koyu cam efekti */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
}

/* ortadaki kart */
.center-box {
  position: absolute;
  top: 50%;
  left: 55%;
  transform: translate(-50%, -50%);
  background: rgba(20,20,30,0.85);
  padding: 28px 36px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

.center-box h2 {
  margin: 0 0 8px;
}

.center-box p {
  margin: 0 0 14px;
  opacity: 0.8;
}

.tags span {
  display: inline-block;
  padding: 6px 12px;
  margin: 4px;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 20px;
  font-size: 13px;
}
</style>
</head>

<body>
  <div class="overlay"></div>

  <div class="center-box">
    <h2>Nereden başlayalım?</h2>
    <p>Bir mesaj yaz reis.</p>
    <div class="tags">
      <span>Porsche</span>
      <span>Plan</span>
      <span>Motivasyon</span>
    </div>
  </div>
</body>
</html>
