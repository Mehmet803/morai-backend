<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>MorAI</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

body {
  background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.65)),
    url("https://images.unsplash.com/photo-1605559424843-9c0d48b3f0b1?auto=format&fit=crop&w=1920&q=80");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.center {
  position: absolute;
  top: 50%;
  left: 55%;
  transform: translate(-50%, -50%);
  background: rgba(20,22,30,0.88);
  padding: 28px 36px;
  border-radius: 16px;
  color: #fff;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
}

.center h2 {
  margin-bottom: 6px;
}

.center p {
  opacity: 0.8;
  margin-bottom: 14px;
}

.tags span {
  display: inline-block;
  margin: 4px;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.3);
  font-size: 13px;
}
</style>
</head>

<body>
  <div class="center">
    <h2>Nereden başlayalım?</h2>
    <p>Bir mesaj yaz reis.</p>
    <div class="tags">
      <span>Porsche</span>
      <span>Plan</span>
      <span>Motivasyon</span>
    </div>
  </div>
</body>
</html>
