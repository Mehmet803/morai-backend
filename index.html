<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MorAI</title>

<style>
:root{
  --bg:#020617;
  --panel:#020617;
  --panel2:#0b1220;
  --border:#1f2937;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --accent:#22c55e;
  --accentSoft:#052e16;
  --bubbleUser:#16a34a;
  --bubbleAI:#0b1220;
}

/* 🔥 PORSCHE BACKGROUND */
body{
  margin:0;
  font-family: system-ui, Arial;
  height:100vh;
  overflow:hidden;
  display:flex;
  color:var(--text);
  background:
    linear-gradient(rgba(2,6,23,.85), rgba(2,6,23,.85)),
    url("porsche.jpg") center/cover no-repeat fixed;
}

*{box-sizing:border-box}

.app{width:100%;display:flex;height:100vh;max-width:1400px;margin:0 auto}

/* Sidebar */
.sidebar{
  width:290px;
  background:linear-gradient(to bottom,var(--panel),var(--panel2));
  border-right:1px solid var(--border);
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.brand{display:flex;justify-content:space-between;align-items:center}
.logo{width:28px;height:28px;border-radius:50%;background:#22c55e}
.btn{
  background:var(--accent);border:none;color:#fff;
  padding:10px;border-radius:10px;font-weight:700;cursor:pointer
}
.chip-btn{
  border:1px solid var(--border);background:transparent;color:var(--text);
  padding:6px;border-radius:20px;cursor:pointer
}
.chatlist{flex:1;overflow:auto}

/* Main */
.main{flex:1;display:flex;flex-direction:column}
.topbar{
  height:56px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;padding:0 16px
}
.messages{flex:1;overflow:auto;padding:20px;position:relative}

.empty{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center
}
.empty-card{
  background:rgba(2,6,23,.7);border:1px solid var(--border);
  border-radius:16px;padding:20px;text-align:center
}
.quick{
  margin:4px;border:1px solid var(--border);
  background:transparent;color:var(--text);
  padding:6px 10px;border-radius:20px;cursor:pointer
}

/* Bubbles */
.row{display:flex;margin-bottom:10px}
.row.user{justify-content:flex-end}
.bubble{
  max-width:70%;padding:10px;border-radius:14px
}
.bubble.user{background:var(--bubbleUser)}
.bubble.ai{background:var(--bubbleAI);border:1px solid var(--border)}

/* Composer */
.composer{border-top:1px solid var(--border);padding:10px}
.composer-inner{display:flex;gap:10px}
.text{flex:1;background:transparent;border:none;color:var(--text);resize:none}
.send{background:var(--accent);border:none;color:#fff;padding:8px 14px;border-radius:10px}

@media(max-width:900px){.sidebar{display:none}}
</style>
</head>

<body class="dark">
<div class="app">

<aside class="sidebar">
  <div class="brand">
    <div style="display:flex;gap:8px;align-items:center">
      <div class="logo"></div><b>MorAI</b>
    </div>
    <span style="font-size:12px;color:#22c55e">Gemini</span>
  </div>

  <button class="btn" id="newChatBtn">+ Yeni sohbet</button>

  <div style="display:flex;gap:6px">
    <button class="chip-btn" id="themeBtn">🌙 / ☀️</button>
    <button class="chip-btn" id="clearAllBtn">🧹</button>
  </div>

  <div class="chatlist" id="chatList"></div>
</aside>

<main class="main">
<header class="topbar">
  <div>
    <div id="chatTitle"><b>Yeni sohbet</b></div>
    <small>Enter: gönder • Shift+Enter: satır</small>
  </div>
  <div id="statusText">Hazır</div>
</header>

<section class="messages" id="messages">
  <div class="empty" id="emptyState">
    <div class="empty-card">
      <h3>Nereden başlayalım?</h3>
      <p>Bir mesaj yaz reis.</p>
      <button class="quick" data-q="BMW öner">BMW</button>
      <button class="quick" data-q="Günlük plan yap">Plan</button>
      <button class="quick" data-q="Motivasyon yaz">Motivasyon</button>
    </div>
  </div>
</section>

<section class="composer">
  <div class="composer-inner">
    <textarea id="input" class="text" placeholder="Mesaj yaz..."></textarea>
    <button class="send" id="sendBtn">Gönder</button>
  </div>
</section>
</main>
</div>

<script>
const BACKEND_URL="/api/chat";
const LS_CHATS="morai_chats";
const LS_THEME="morai_theme";

let chats=JSON.parse(localStorage.getItem(LS_CHATS)||"[]");
let currentId=null;
let sending=false;

function uid(){return Math.random().toString(36).slice(2)}
function save(){localStorage.setItem(LS_CHATS,JSON.stringify(chats))}
function byId(id){return chats.find(c=>c.id===id)}

function ensureChat(){
  if(!chats.length){
    const id=uid();
    chats=[{id,title:"Yeni sohbet",messages:[]}];
    currentId=id; save();
  }
  if(!currentId) currentId=chats[0].id;
}

function render(){
  const list=document.getElementById("chatList");
  list.innerHTML="";
  chats.forEach(c=>{
    const d=document.createElement("div");
    d.textContent=c.title;
    d.style.cursor="pointer";
    d.onclick=()=>{currentId=c.id;render()};
    list.appendChild(d);
  });

  const chat=byId(currentId);
  document.getElementById("chatTitle").textContent=chat.title;

  const wrap=document.getElementById("messages");
  wrap.querySelectorAll(".row").forEach(n=>n.remove());
  document.getElementById("emptyState").style.display=
    chat.messages.length?"none":"flex";

  chat.messages.forEach(m=>{
    const r=document.createElement("div");
    r.className="row "+m.role;
    const b=document.createElement("div");
    b.className="bubble "+m.role;
    b.textContent=m.content;
    r.appendChild(b);
    wrap.appendChild(r);
  });
}

async function sendMessage(){
  if(sending) return;
  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;

  ensureChat();
  const chat=byId(currentId);
  if(chat.title==="Yeni sohbet") chat.title=text.slice(0,24);

  chat.messages.push({role:"user",content:text});
  save(); render();
  input.value="";

  const history=chat.messages.slice(-10);
  sending=true;
  document.getElementById("statusText").textContent="Gönderiliyor…";

  try{
    const r=await fetch(BACKEND_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:history})
    });
    const d=await r.json();
    chat.messages.push({role:"ai",content:d.reply||"Boş yanıt"});
  }catch{
    chat.messages.push({role:"ai",content:"Sunucu hatası"});
  }

  sending=false;
  document.getElementById("statusText").textContent="Hazır";
  save(); render();
}

document.getElementById("sendBtn").onclick=sendMessage;
document.getElementById("input").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}
});

document.querySelectorAll(".quick").forEach(b=>{
  b.onclick=()=>{document.getElementById("input").value=b.dataset.q}
});

document.getElementById("newChatBtn").onclick=()=>{
  chats.unshift({id:uid(),title:"Yeni sohbet",messages:[]});
  currentId=chats[0].id; save(); render();
};

document.getElementById("themeBtn").onclick=()=>{
  document.body.classList.toggle("dark");
};

document.getElementById("clearAllBtn").onclick=()=>{
  if(confirm("Tüm sohbetler silinsin mi?")){
    chats=[]; currentId=null; save(); ensureChat(); render();
  }
};

ensureChat(); render();
</script>
</body>
</html>
