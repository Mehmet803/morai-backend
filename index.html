<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MorAI</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff;height:100vh;display:flex}
.app{display:flex;width:100%}
.sidebar{width:260px;background:#020617;padding:10px}
.main{flex:1;display:flex;flex-direction:column}
.messages{flex:1;padding:10px;overflow:auto}
.row{margin-bottom:8px}
.user{color:#22c55e}
.ai{color:#e5e7eb}
.composer{display:flex;padding:10px;border-top:1px solid #334155}
textarea{flex:1;padding:8px}
button{margin-left:8px;padding:8px}
</style>
</head>

<body>
<div class="app">
  <div class="sidebar">
    <button id="newChatBtn">+ Yeni Sohbet</button>
  </div>

  <div class="main">
    <div class="messages" id="messages"></div>

    <div class="composer">
      <textarea id="input" placeholder="Mesaj yaz..."></textarea>
      <button id="sendBtn">Gönder</button>
    </div>
  </div>
</div>

<script>
const BACKEND_URL = "/api/chat";

let chats = JSON.parse(localStorage.getItem("chats") || "[]");
let current = 0;

if(chats.length === 0){
  chats.push({ messages: [] });
}

function render(){
  const box = document.getElementById("messages");
  box.innerHTML = "";
  chats[current].messages.forEach(m=>{
    const div = document.createElement("div");
    div.className = "row " + m.role;
    div.textContent = m.content;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

async function sendMessage(){
  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;

  chats[current].messages.push({ role:"user", content:text });
  render();
  input.value = "";

  const history = chats[current].messages.slice(-10);

  const res = await fetch(BACKEND_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ messages: history })
  });

  const data = await res.json();
  chats[current].messages.push({ role:"ai", content:data.reply });
  localStorage.setItem("chats", JSON.stringify(chats));
  render();
}

document.getElementById("sendBtn").onclick = sendMessage;

document.getElementById("input").addEventListener("keydown", e=>{
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById("newChatBtn").onclick = ()=>{
  chats.push({ messages: [] });
  current = chats.length - 1;
  render();
};

render();
</script>
</body>
</html>
