<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MorAI</title>

  <style>
    :root{
      --bg:#f6f7fb;
      --panel:#ffffff;
      --panel2:#f9fafb;
      --border:#e5e7eb;
      --text:#0f172a;
      --muted:#6b7280;
      --accent:#10b981;
      --accentSoft:#d1fae5;

      --bubbleUser:#10b981;
      --bubbleAI:#eef2f7;

      --shadow: 0 10px 30px rgba(2,6,23,.08);
      --shadow2: 0 8px 20px rgba(2,6,23,.10);

      --btn:#111827;
      --btnText:#fff;

      --chip:#11182710;
      --chipText:#111827;

      --inputBg:#ffffff;
      --inputBorder:#d1d5db;
    }

    body.dark{
      --bg:#020617;
      --panel:#020617;
      --panel2:#0b1220;
      --border:#1f2937;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --accent:#22c55e;
      --accentSoft:#052e16;

      --bubbleUser:#16a34a;
      --bubbleAI:#0b1220;

      --shadow: 0 10px 30px rgba(0,0,0,.45);
      --shadow2: 0 8px 20px rgba(0,0,0,.35);

      --btn:#111827;
      --btnText:#fff;

      --chip:#ffffff12;
      --chipText:#e5e7eb;

      --inputBg:#020617;
      --inputBorder:#334155;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(900px 500px at 15% 0%, rgba(16,185,129,.16), transparent 60%),
        radial-gradient(900px 500px at 85% 10%, rgba(56,189,248,.12), transparent 60%),
        var(--bg);
      color:var(--text);
      height:100vh;
      overflow:hidden;
      display:flex;
    }

    .app{width:100%; display:flex; height:100vh; max-width:1400px; margin:0 auto;}

    .sidebar{
      width:290px;
      background:linear-gradient(to bottom, var(--panel), var(--panel2));
      border-right:1px solid var(--border);
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .brand{display:flex;align-items:center;justify-content:space-between;}
    .brand-left{display:flex;align-items:center;gap:10px;}
    .logo{
      width:28px;height:28px;border-radius:999px;
      background: radial-gradient(circle at 30% 30%, #a7f3d0, #22c55e);
      box-shadow: 0 0 18px rgba(34,197,94,.55);
    }

    .pill{
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      background:var(--accentSoft);
      color:var(--accent);
    }

    .btn{
      border:none;
      background:var(--accent);
      color:#fff;
      font-weight:600;
      border-radius:10px;
      padding:10px;
      cursor:pointer;
    }

    .chatlist{
      flex:1;
      overflow:auto;
      border-radius:12px;
      border:1px solid var(--border);
      padding:4px;
    }

    .main{flex:1;display:flex;flex-direction:column;}
    .topbar{
      height:56px;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
    }

    .messages{
      flex:1;
      overflow:auto;
      padding:18px;
      position:relative;
    }

    .empty{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .empty-card{
      padding:20px;
      border-radius:16px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.55);
    }

    .row{display:flex;margin-bottom:10px;}
    .row.user{justify-content:flex-end;}
    .bubble{
      max-width:72%;
      padding:11px 13px;
      border-radius:16px;
      white-space:pre-wrap;
    }
    .bubble.user{background:var(--bubbleUser);color:#fff;}
    .bubble.ai{background:var(--bubbleAI);}

    .composer{
      border-top:1px solid var(--border);
      padding:12px;
    }

    .composer-inner{
      display:flex;
      gap:10px;
    }

    .text{
      flex:1;
      resize:none;
      border:none;
      outline:none;
    }

    .send{
      border:none;
      background:var(--accent);
      color:#fff;
      font-weight:700;
      padding:10px 14px;
      border-radius:12px;
    }
  </style>
</head>

<body class="dark">
<div class="app">

<aside class="sidebar">
  <div class="brand">
    <div class="brand-left">
      <div class="logo"></div>
      <b>MorAI</b>
    </div>
    <div class="pill">Gemini</div>
  </div>

  <button class="btn" id="newChatBtn">+ Yeni sohbet</button>
  <div class="chatlist" id="chatList"></div>
</aside>

<main class="main">
  <header class="topbar">
    <div>
      <div id="chatTitle">Yeni sohbet</div>
      <small>Enter: gönder • Shift+Enter: satır</small>
    </div>
    <div>Hazır</div>
  </header>

  <section class="messages" id="messages">
    <div class="empty" id="emptyState">
      <div class="empty-card">
        <b>Nereden başlayalım?</b><br/>Bir mesaj yaz.
      </div>
    </div>
  </section>

  <section class="composer">
    <div class="composer-inner">
      <textarea id="input" class="text"></textarea>
      <button class="send" id="sendBtn">Gönder</button>
    </div>
  </section>
</main>

</div>

<script>
/* ===== SADECE BURASI EKLENDİ (HAFIZA) ===== */

const BACKEND_URL = "/api/chat";
let chats = JSON.parse(localStorage.getItem("morai_mem")||"[]");
let current = 0;

if(!chats.length) chats.push({title:"Yeni sohbet",messages:[]});

function render(){
  const box=document.getElementById("messages");
  const empty=document.getElementById("emptyState");
  box.querySelectorAll(".row").forEach(n=>n.remove());

  const chat=chats[current];
  document.getElementById("chatTitle").textContent=chat.title;

  if(chat.messages.length===0){empty.style.display="flex";return;}
  empty.style.display="none";

  chat.messages.forEach(m=>{
    const r=document.createElement("div");
    r.className="row "+m.role;
    const b=document.createElement("div");
    b.className="bubble "+m.role;
    b.textContent=m.content;
    r.appendChild(b);
    box.appendChild(r);
  });
}

async function sendMessage(){
  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;

  const chat=chats[current];
  if(chat.title==="Yeni sohbet") chat.title=text.slice(0,32);

  chat.messages.push({role:"user",content:text});
  input.value="";
  render();

  const history=chat.messages.slice(-10);

  const r=await fetch(BACKEND_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({messages:history})
  });
  const j=await r.json();
  chat.messages.push({role:"ai",content:j.reply});

  localStorage.setItem("morai_mem",JSON.stringify(chats));
  render();
}

document.getElementById("sendBtn").onclick=sendMessage;
document.getElementById("input").onkeydown=e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
};
document.getElementById("newChatBtn").onclick=()=>{
  chats.unshift({title:"Yeni sohbet",messages:[]});
  current=0;
  render();
};

render();
</script>
</body>
</html>
