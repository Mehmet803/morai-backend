<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MorAI</title>

  <style>
    :root{
      --bg:#f6f7fb;
      --panel:#ffffff;
      --panel2:#f9fafb;
      --border:#e5e7eb;
      --text:#0f172a;
      --muted:#6b7280;
      --accent:#10b981;
      --accentSoft:#d1fae5;

      --bubbleUser:#10b981;
      --bubbleAI:#eef2f7;

      --shadow: 0 10px 30px rgba(2,6,23,.08);
      --shadow2: 0 8px 20px rgba(2,6,23,.10);

      --btn:#111827;
      --btnText:#fff;

      --chip:#11182710;
      --chipText:#111827;

      --inputBg:#ffffff;
      --inputBorder:#d1d5db;
    }

    body.dark{
      --bg:#020617;
      --panel:#020617;
      --panel2:#0b1220;
      --border:#1f2937;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --accent:#22c55e;
      --accentSoft:#052e16;

      --bubbleUser:#16a34a;
      --bubbleAI:#0b1220;

      --shadow: 0 10px 30px rgba(0,0,0,.45);
      --shadow2: 0 8px 20px rgba(0,0,0,.35);

      --btn:#111827;
      --btnText:#fff;

      --chip:#ffffff12;
      --chipText:#e5e7eb;

      --inputBg:#020617;
      --inputBorder:#334155;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(900px 500px at 15% 0%, rgba(16,185,129,.16), transparent 60%),
        radial-gradient(900px 500px at 85% 10%, rgba(56,189,248,.12), transparent 60%),
        var(--bg);
      color:var(--text);
      height:100vh;
      overflow:hidden;
      display:flex;
    }

    .app{width:100%; display:flex; height:100vh; max-width:1400px; margin:0 auto;}

    .sidebar{
      width:290px;
      background:linear-gradient(to bottom, var(--panel), var(--panel2));
      border-right:1px solid var(--border);
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .brand{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:6px 4px;
    }
    .brand-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .logo{
      width:28px;height:28px;border-radius:999px;
      background: radial-gradient(circle at 30% 30%, #a7f3d0, #22c55e);
      box-shadow: 0 0 18px rgba(34,197,94,.55);
    }
    .brand-title{
      font-weight:700;
      font-size:16px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .pill{
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      background:var(--accentSoft);
      color:var(--accent);
      border:1px solid rgba(34,197,94,.25);
      white-space:nowrap;
    }
  </style>
</head>

<body class="dark">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-left">
          <div class="logo"></div>
          <div class="brand-title">MorAI</div>
        </div>
        <div class="pill">Gemini</div>
      </div>
    </aside>
  </div>
</body>
</html>
