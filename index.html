<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>MorAI</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

/* ARKA PLAN */
body {
  background-image: url("./porsche.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

/* GRADIENT + CAM */
.overlay {
  position: fixed;
  inset: 0;
  background: linear-gradient(
    rgba(0,0,0,0.45),
    rgba(0,0,0,0.65)
  );
}

/* MERKEZ KART */
.card {
  position: absolute;
  top: 50%;
  left: 55%;
  transform: translate(-50%, -50%);
  background: rgba(20,22,30,0.85);
  padding: 28px 36px;
  border-radius: 16px;
  color: #fff;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
}

.card h2 {
  margin-bottom: 8px;
}

.card p {
  opacity: 0.8;
  margin-bottom: 14px;
}

.tags span {
  display: inline-block;
  margin: 4px;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.3);
  font-size: 13px;
}
</style>
</head>

<body>
  <div class="overlay"></div>

  <div class="card">
    <h2>Nereden başlayalım?</h2>
    <p>Bir mesaj yaz reis.</p>
    <div class="tags">
      <span>Porsche</span>
      <span>Plan</span>
      <span>Motivasyon</span>
    </div>
  </div>
</body>
</html>
